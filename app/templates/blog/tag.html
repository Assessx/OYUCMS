{% extends "base.html" %}

{% block title %}{{ tag.name }} - OYUCMS{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900">Tag: {{ tag.name }}</h1>
    <div class="mt-6 space-y-4">
        {% for post in posts.items %}
        <article class="bg-white border rounded-lg p-5">
            <h2 class="text-lg font-semibold">
                <a class="text-primary-700 hover:underline" href="{{ url_for('blog.post_detail', slug=post.slug) }}">{{ post.title }}</a>
            </h2>
            <p class="text-sm text-gray-600 mt-2">{{ post.get_excerpt() }}</p>
        </article>
        {% else %}
        <p class="text-sm text-gray-500">No posts with this tag.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
